    <!-- SPA redirect script for GitHub Pages -->
    <script type="text/javascript">
      !(function (n) {
        if ("/" === n.search[1]) {
          var a = n.search
            .slice(1)
            .split("&")
            .map(function (n) {
              return n.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, n.pathname.slice(0, -1) + a + n.hash);
        }
      })(window.location);
    </script>
